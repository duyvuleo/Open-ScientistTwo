name: Credential scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Redacted full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          task_scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$task_scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$task_scanner_dir/scanner.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$task_scanner_dir/scanner.tar.gz" | sha256sum --check --strict
          tar -xzf "$task_scanner_dir/scanner.tar.gz" -C "$task_scanner_dir" gitleaks
      - name: Scan all fetched history with full redaction
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git "$GITHUB_WORKSPACE" \
            --log-opts="--all --full-history" --redact=100 --no-banner
